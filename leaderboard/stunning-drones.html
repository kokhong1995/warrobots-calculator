<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Primary Meta Tags -->
    <title>Stunning Drones Leaderboard Calculator - War Robots</title>
    <meta name="title" content="Stunning Drones Leaderboard Calculator - War Robots" />
    <meta name="description"
        content="Calculate the exact microchips and upgrade tokens required for drone upgrades to hit target leaderboard points in War Robots." />
    <meta name="keywords"
        content="War Robots stunning drones, drone upgrade calculator, microchip calculator, upgrade tokens, leaderboard event" />
    <link rel="canonical" href="https://kokhong1995.github.io/warrobots-calculator/leaderboard/stunning-drones.html" />
    <!-- Open Graph / Facebook / Discord -->
    <meta property="og:type" content="website" />
    <meta property="og:url"
        content="https://kokhong1995.github.io/warrobots-calculator/leaderboard/stunning-drones.html" />
    <meta property="og:title" content="Stunning Drones Leaderboard Calculator - War Robots" />
    <meta property="og:description"
        content="Calculate the exact microchips and upgrade tokens required for drone upgrades to hit target leaderboard points in War Robots." />
    <!-- Twitter / X -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url"
        content="https://kokhong1995.github.io/warrobots-calculator/leaderboard/stunning-drones.html" />
    <meta property="twitter:title" content="Stunning Drones Leaderboard Calculator - War Robots" />
    <meta property="twitter:description"
        content="Calculate the exact microchips and upgrade tokens required for drone upgrades to hit target leaderboard points in War Robots." />
    <link href="../bootstrap-5.3.8-dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/stunning-drones.css?v=1.0.9" rel="stylesheet">
</head>

<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-dark bg-dark shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="../index.html">War Robots Calculator</a>
        </div>
    </nav>
    <div class="container my-4">
        <div class="row">
            <div class="col-12">
                <div class="card shadow-sm border-0 bg-light p-3 mb-4">
                    <span class="badge bg-primary w-auto align-self-start mb-2">Leaderboard</span>
                    <h4 class="fw-bold mb-0">Stunning Drones</h4>
                </div>
            </div>
        </div>
        <div class="row g-4">
            <!-- Left Column: Inputs -->
            <div class="col-lg-8">
                <div class="card mb-4">
                    <div class="card-header font-weight-bold">
                        <div class="row align-items-center justify-content-between">
                            <div class="col-auto">
                                <span class="font-weight-bold">1. Modifiers</span>
                            </div>
                            <div class="col-auto">
                                <button type="button" class="btn btn-sm btn-outline-danger"
                                    onclick="resetModifier()">Reset</button>
                            </div>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="container-fluid px-0">
                            <div class="row g-2 align-items-center">
                                <div class="col-md-4">
                                    <label for="inputDiscountPercentage"
                                        class="form-label text-secondary small fw-medium">Discount
                                        %</label>
                                    <input type="number" class="form-control" id="inputDiscountPercentage" min="0"
                                        value="0" oninput="syncData()">
                                </div>
                                <div class="col-md-4">
                                    <label for="inputInitialPoints"
                                        class="form-label text-secondary small fw-medium">Initial
                                        Points</label>
                                    <input type="number" class="form-control" id="inputInitialPoints" min="0" value="0"
                                        oninput="syncData()">
                                </div>
                                <div class="col-md-4">
                                    <label for="inputBattlesToWin"
                                        class="form-label text-secondary small fw-medium">Battles
                                        To Win</label>
                                    <input type="number" class="form-control" id="inputBattlesToWin" min="0" value="0"
                                        oninput="syncData()">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <div class="row align-items-center justify-content-between">
                            <div class="col-auto">
                                <span class="font-weight-bold">2. Drone Upgrades</span>
                            </div>
                            <div class="col-auto">
                                <button type="button" class="btn btn-sm btn-outline-danger"
                                    onclick="resetDroneUpgrades()">Reset</button>
                            </div>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="container-fluid px-0">
                            <div id="droneUpgradeContainer" class="row g-2"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Column: Live Sticky Totals -->
            <div class="col-lg-4">
                <div class="card border-primary sticky-top" style="top: 5rem; z-index: 1000;">
                    <div class="card-header bg-primary text-white">Total Summary</div>
                    <div class="card-body">
                        <div class="d-flex justify-content-between mb-2">
                            <span>Quantity</span> <span id="totalQuantity" class="fw-bold">0</span>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span>Microchips</span> <span id="totalMicrochipsCost" class="fw-bold">0</span>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span>Upgrade Tokens</span> <span id="totalUpgradeTokensCost" class="fw-bold">0</span>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span>Points</span> <span id="totalPoints" class="fw-bold">0</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="../data/ds-drone-upgrades.js?v=1.0.0"></script>
    <script src="js/stunning-drones.js?v=1.0.3"></script>
    <script src="../bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>

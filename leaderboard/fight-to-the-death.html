        content="Calculate Silver, Gold, Upgrade Tokens, and time required to reach your target points in the War Robots Fight To The Death leaderboard event." />

    <link rel="apple-touch-icon" sizes="180x180" href="/warrobots-calculator/apple-touch-icon.png">
    <link rel="stylesheet" href="/warrobots-calculator/bootstrap-5.3.8-dist/css/bootstrap.min.css?v=1.6.1">
    <link rel="stylesheet" href="/warrobots-calculator/css/index.css?v=1.6.1">
    <link rel="stylesheet" href="./css/fight-to-the-death.css?v=1.6.1">
    <script src="/warrobots-calculator/data/ds-t4-robot-upgrades.js?v=1.6.1"></script>
    <script src="/warrobots-calculator/data/ds-t4-robot-weapon-upgrades.js?v=1.6.1"></script>
    <script type="module" src="./js/fight-to-the-death.js?v=1.6.1"></script>
</head>

<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-dark bg-dark shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/warrobots-calculator">War Robots Calculator</a>
        </div>
    </nav>
    <div id="mainContainer" class="container my-4">
        <div class="row">
            <div class="col-12">
                <div class="card shadow-sm border-0 bg-light p-3 mb-4">
                    <span class="badge bg-leaderboard w-auto align-self-start mb-2">Leaderboard</span>
                    <h4 class="fw-bold mb-0">Fight To The Death</h4>
                </div>
            </div>
        </div>
        <div class="row g-4">
            <!-- Left Column: Inputs -->
            <div class="col-lg-8">
                <div class="card mb-4">
                    <div class="card-header font-weight-bold">
                        <div class="row align-items-center justify-content-between">
                            <div class="col-auto">
                                <span class="font-weight-bold">1. Modifiers</span>
                            </div>
                            <div class="col-auto">
                                <button type="button" id="buttonResetModifiers"
                                    class="btn btn-sm btn-outline-danger">Reset</button>
                            </div>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="container-fluid px-0">
                            <div class="row g-2 align-items-center">
                                <div class="col-md-4">
                                    <label for="inputUpgradeDiscountPercentage"
                                        class="form-label text-secondary small fw-medium">Upgrade Discount
                                        %</label>
                                    <input type="number" class="form-control sync-data"
                                        id="inputUpgradeDiscountPercentage" min="0" value="0">
                                </div>
                                <div class="col-md-4">
                                    <label for="inputUpgradeSpeedMultiplier"
                                        class="form-label text-secondary small fw-medium">Upgrade Speed
                                        Multiplier</label>
                                    <input type="number" class="form-control sync-data" id="inputUpgradeSpeedMultiplier"
                                        min="0" value="0" step="any">
                                </div>
                                <div class="col-md-4">
                                    <label for="inputInitialPoints"
                                        class="form-label text-secondary small fw-medium">Initial
                                        Points</label>
                                    <input type="number" class="form-control sync-data" id="inputInitialPoints" min="0"
                                        value="0">
                                </div>
                                <div class="col-md-4">
                                    <label for="inputTotalTitanDeploys"
                                        class="form-label text-secondary small fw-medium">Total Titan Deploys</label>
                                    <input type="number" class="form-control sync-data" id="inputTotalTitanDeploys"
                                        min="0" value="0">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- Tier 4 Robot Upgrades -->
                <div class="card mb-4">
                    <div class="card-header">
                        <div class="row align-items-center justify-content-between">
                            <div class="col-auto">
                                <div class="d-flex align-items-center">
                                    <span class="font-weight-bold">2. Tier 4 Robot Upgrades</span>
                                </div>
                            </div>
                            <div class="col-auto">
                                <button type="button" class="btn btn-sm btn-outline-danger"
                                    id="buttonResetT4RobotUpgrades">Reset</button>
                            </div>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="container-fluid px-0">
                            <div id="t4RobotUpgradesContainer" class="row g-2"></div>
                        </div>
                    </div>
                </div>
                <!-- Tier 4 Robot Weapon Upgrades -->
                <div class="card">
                    <div class="card-header">
                        <div class="row align-items-center justify-content-between">
                            <div class="col-auto">
                                <div class="d-flex align-items-center">
                                    <span class="font-weight-bold">3. Tier 4 Robot Weapon Upgrades</span>
                                </div>
                            </div>
                            <div class="col-auto">
                                <button type="button" class="btn btn-sm btn-outline-danger"
                                    id="buttonResetT4RobotWeaponUpgrades">Reset</button>
                            </div>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="container-fluid px-0">
                            <div id="t4RobotWeaponUpgradesContainer" class="row g-2"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Column: Live Sticky Totals -->
            <div class="col-lg-4">
                <div class="card border-primary sticky-top" style="top: 5rem; z-index: 1000;">
                    <div class="card-header bg-primary text-white">Total Summary</div>
                    <div class="card-body">
                        <div class="d-flex justify-content-between mb-2">
                            <span>Quantity</span> <span id="totalQuantity" class="fw-bold">0</span>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span>Silver Amount</span> <span id="totalSilverAmount" class="fw-bold"
                                title="0 Silver">0</span>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span>Gold Amount</span> <span id="totalGoldAmount" class="fw-bold" title="0 Gold">0</span>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span>Upgrade Duration</span> <span id="totalUpgradeDuration" class="fw-bold">0</span>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span>Upgrade Tokens</span> <span id="totalUpgradeTokens" class="fw-bold">0</span>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span>Points</span> <span id="totalPoints" class="fw-bold">0</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="/warrobots-calculator/bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js?v=1.6.1"></script>
</body>

</html>

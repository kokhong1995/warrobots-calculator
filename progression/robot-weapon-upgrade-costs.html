        content="Calculate exact Silver (Ag), Gold (Au), and Upgrade Token costs for robot weapons in War Robots. Plan your weapon progression and resource spending." />

    <link rel="stylesheet" href="/warrobots-calculator/css/index.css?v=1.6.0">
    <link rel="stylesheet" href="./css/robot-weapon-upgrade-costs.css?v=1.6.0">
    <script src="/warrobots-calculator/data/ds-t4-robot-weapon-upgrades.js?v=1.6.0"></script>

</head>

<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-dark bg-dark shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/warrobots-calculator">War Robots Calculator</a>
        </div>
    </nav>
    <div id="mainContainer" class="container my-4">
        <div class="row">
            <div class="col-12">
                <div class="card shadow-sm border-0 bg-light p-3 mb-4">
                    <span class="badge bg-progression w-auto align-self-start mb-2">Progression</span>
                    <h4 class="fw-bold mb-0">Robot Weapon Upgrade Costs</h4>
                </div>
            </div>
        </div>
        <div class="row g-4">
            <!-- Left Column: Inputs -->
            <div class="col-lg-8">
                <div class="card mb-4">
                    <div class="card-header font-weight-bold">
                        <div class="row align-items-center justify-content-between">
                            <div class="col-auto">
                                <span class="font-weight-bold">1. Modifiers</span>
                            </div>
                            <div class="col-auto">
                                <button type="button" id="buttonResetModifiers"
                                    class="btn btn-sm btn-outline-danger">Reset</button>
                            </div>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="container-fluid px-0">
                            <div class="row g-2 align-items-center">
                                <div class="col-md-4">
                                    <label for="inputRobotWeaponUpgradeDiscountPercentage"
                                        class="form-label text-secondary small fw-medium">Weapon Upgrade Discount
                                        %</label>
                                    <input type="number" class="form-control sync-data"
                                        id="inputRobotWeaponUpgradeDiscountPercentage" min="0" value="0">
                                </div>
                                <div class="col-md-4">
                                    <label for="inputRobotWeaponUpgradeSpeedMultiplier"
                                        class="form-label text-secondary small fw-medium">Weapon Upgrade Speed
                                        Multiplier</label>
                                    <input type="number" class="form-control sync-data"
                                        id="inputRobotWeaponUpgradeSpeedMultiplier" min="0" value="0" step="any">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <div class="row align-items-center justify-content-between">
                            <div class="col-auto">
                                <div class="d-flex align-items-center">
                                    <span class="font-weight-bold">2. Tier 4 Robot Weapon Upgrades</span>
                                </div>
                            </div>
                            <div class="col-auto">
                                <button type="button" class="btn btn-sm btn-outline-danger"
                                    id="buttonResetT4RobotWeaponUpgrades">Reset</button>
                            </div>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="container-fluid px-0">
                            <div id="t4WeaponUpgradeContainer" class="row g-2"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Column: Live Sticky Totals -->
            <div class="col-lg-4">
                <div class="card border-primary sticky-top" style="top: 5rem; z-index: 1000;">
                    <div class="card-header bg-primary text-white">Total Summary</div>
                    <div class="card-body">
                        <div class="d-flex justify-content-between mb-2">
                            <span>Quantity</span> <span id="totalQuantity" class="fw-bold">0</span>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span>Silver Amount</span> <span id="totalSilverAmount" class="fw-bold"
                                title="0 Silver">0</span>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span>Gold Amount</span> <span id="totalGoldAmount" class="fw-bold" title="0 Gold">0</span>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span>Upgrade Duration</span> <span id="totalUpgradeDuration" class="fw-bold">0</span>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span>Upgrade Tokens</span> <span id="totalUpgradeTokens" class="fw-bold">0</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="/warrobots-calculator/bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js?v=1.6.0"></script>

</html>

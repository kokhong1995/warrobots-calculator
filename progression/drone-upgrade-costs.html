<body>
    <!-- Navigation Bar -->

        <div class="container">

        </div>
    </nav>
    <div id="mainContainer" class="container my-4">
        <div class="row">
            <div class="col-12">
                <div class="card shadow-sm border-0 bg-light p-3 mb-4">
                    <span class="badge bg-progression w-auto align-self-start mb-2">Progression</span>
                    <h4 class="fw-bold mb-0">Drone Upgrade Costs</h4>
                </div>
            </div>
        </div>
        <div class="row g-4">
            <!-- Left Column: Inputs -->
            <div class="col-lg-8">
                <div class="card mb-4">
                    <div class="card-header font-weight-bold">
                        <div class="row align-items-center justify-content-between">
                            <div class="col-auto">
                                <span class="font-weight-bold">1. Modifiers</span>
                            </div>
                            <div class="col-auto">
                                <button type="button" id="buttonResetModifiers"

                            </div>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="container-fluid px-0">
                            <div class="row g-2 align-items-center">
                                <div class="col-md-4">
                                    <label for="inputDroneUpgradeDiscountPercentage"
                                        class="form-label text-secondary small fw-medium">Drone Upgrade Discount
                                        %</label>
                                    <input type="number" class="form-control sync-data"
                                        id="inputDroneUpgradeDiscountPercentage" min="0" value="0">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <div class="row align-items-center justify-content-between">
                            <div class="col-auto">
                                <div class="d-flex align-items-center">
                                    <span class="font-weight-bold">2. Drone Upgrades</span>
                                    <button type="button"
                                        class="btn btn-sm btn-link text-secondary pt-0 pb-0 text-decoration-none fs-5"

                                        data-bs-html="true" data-bs-title="Max Level Caps"
                                        data-bs-content="<ul class='list-unstyled mb-0 small'><li><strong>Tier 1:</strong> Max Level 3</li><li><strong>Tier 2:</strong> Max Level 6</li><li><strong>Tier 3:</strong> Max Level 9</li><li><strong>Tier 4:</strong> Max Level 12</li></ul>"
                                        aria-label="Tier Level Limits Information">
                                        <i class="bi bi-info-circle-fill"></i> ⓘ
                                    </button>
                                </div>
                            </div>
                            <div class="col-auto">
                                <button type="button" class="btn btn-sm btn-outline-danger"
                                    id="buttonResetDroneUpgrades">Reset</button>
                            </div>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="container-fluid px-0">
                            <div id="droneUpgradeContainer" class="row g-2"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Column: Live Sticky Totals -->
            <div class="col-lg-4">
                <div class="card border-primary sticky-top" style="top: 5rem; z-index: 1000;">
                    <div class="card-header bg-primary text-white">Total Summary</div>
                    <div class="card-body">
                        <div class="d-flex justify-content-between mb-2">
                            <span>Quantity</span> <span id="totalQuantity" class="fw-bold">0</span>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span>Microchips</span> <span id="totalMicrochips" class="fw-bold">0</span>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span>Upgrade Tokens</span> <span id="totalUpgradeTokens" class="fw-bold">0</span>

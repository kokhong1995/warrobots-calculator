<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Primary Meta Tags -->
    <title>Drone Upgrade Costs Calculator - War Robots</title>
    <meta name="title" content="Drone Upgrade Costs Calculator - War Robots" />
    <meta name="description"
        content="Calculate the exact microchips and upgrade tokens required for drone upgrades in War Robots." />
    <meta name="keywords"
        content="War Robots drone upgrade costs, drone level calculator, microchip calculator, upgrade tokens, progression cost" />
    <link rel="canonical"
        href="https://kokhong1995.github.io/warrobots-calculator/progression/drone-upgrade-costs.html" />
    <!-- Open Graph / Facebook / Discord -->
    <meta property="og:type" content="website" />
    <meta property="og:url"
        content="https://kokhong1995.github.io/warrobots-calculator/progression/drone-upgrade-costs.html" />
    <meta property="og:title" content="Drone Upgrade Costs Calculator - War Robots" />
    <meta property="og:description"
        content="Calculate the exact microchips and upgrade tokens required for drone upgrades in War Robots." />
    <!-- Twitter / X -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url"
        content="https://kokhong1995.github.io/warrobots-calculator/progression/drone-upgrade-costs.html" />
    <meta property="twitter:title" content="Drone Upgrade Costs Calculator - War Robots" />
    <meta property="twitter:description"
        content="Calculate the exact microchips and upgrade tokens required for drone upgrades in War Robots." />
    <link href="../bootstrap-5.3.8-dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/index.css?v=1.1.0" rel="stylesheet">
    <link href="css/drone-upgrade-costs.css?v=1.1.0" rel="stylesheet">
</head>

<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-dark bg-dark shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="../index.html">War Robots Calculator</a>
        </div>
    </nav>
    <div class="container my-4">
        <div class="row">
            <div class="col-12">
                <div class="card shadow-sm border-0 bg-light p-3 mb-4">
                    <span class="badge bg-progression w-auto align-self-start mb-2">Progression</span>
                    <h4 class="fw-bold mb-0">Drone Upgrade Costs</h4>
                </div>
            </div>
        </div>
        <div class="row g-4">
            <!-- Left Column: Inputs -->
            <div class="col-lg-8">
                <div class="card mb-4">
                    <div class="card-header font-weight-bold">
                        <div class="row align-items-center justify-content-between">
                            <div class="col-auto">
                                <span class="font-weight-bold">1. Modifiers</span>
                            </div>
                            <div class="col-auto">
                                <button type="button" class="btn btn-sm btn-outline-danger"
                                    onclick="resetModifier()">Reset</button>
                            </div>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="container-fluid px-0">
                            <div class="row g-2 align-items-center">
                                <div class="col-md-4">
                                    <label for="inputDiscountPercentage"
                                        class="form-label text-secondary small fw-medium">Discount
                                        %</label>
                                    <input type="number" class="form-control" id="inputDiscountPercentage" min="0"
                                        value="0" oninput="syncData()">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <div class="row align-items-center justify-content-between">
                            <div class="col-auto">
                                <span class="font-weight-bold">2. Tier 4 Drone Upgrades</span>
                            </div>
                            <div class="col-auto">
                                <button type="button" class="btn btn-sm btn-outline-danger"
                                    onclick="resetDroneUpgrades()">Reset</button>
                            </div>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="container-fluid px-0">
                            <div id="droneUpgradeContainer" class="row g-2"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Column: Live Sticky Totals -->
            <div class="col-lg-4">
                <div class="card border-primary sticky-top" style="top: 5rem; z-index: 1000;">
                    <div class="card-header bg-primary text-white">Total Summary</div>
                    <div class="card-body">
                        <div class="d-flex justify-content-between mb-2">
                            <span>Quantity</span> <span id="totalQuantity" class="fw-bold">0</span>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span>Microchips</span> <span id="totalMicrochipsCost" class="fw-bold">0</span>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span>Upgrade Tokens</span> <span id="totalUpgradeTokensCost" class="fw-bold">0</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="../data/ds-t4-drone-upgrades.js?v=1.1.0"></script>
    <script src="js/drone-upgrade-costs.js?v=1.1.0"></script>
    <script src="../bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
